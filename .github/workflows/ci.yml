name: Juice Shop CI # Display this workflow name in GitHub's Actions tab.

on: # Define the events that trigger this workflow.
  pull_request: # Run when a pull request opens, reopens, or receives new commits.
    branches: [main] # Only run for pull requests whose destination branch is main.
  push: # Also run when commits are pushed, including through a merge.
    branches: [main] # Only respond to pushes to main.

permissions: # Set the permissions granted to this workflow's GitHub token.
  contents: read # Allow reading repository contents without granting write access.

jobs: # Define the jobs that GitHub Actions will execute.
  test: # Give the first job the identifier "test".
    name: Install and test # Display this name in the workflow's job list.
    runs-on: ubuntu-latest # Allocate a GitHub-hosted Ubuntu machine.
    container: node:18-bullseye # Run this job's steps inside Node 18 Debian container.

    env: # Define environment variables available to steps in this job.
      YARN_CACHE_FOLDER: .yarn-cache # Tell Yarn where to store downloaded dependency packages.

    steps: # Execute the following steps sequentially.
      - name: Check out repository # Describe the step that retrieves your project files.
        uses: actions/checkout@v7 # Download the code for this event; pull requests normally use a test merge commit.
        with: # Supply configuration options to the checkout action.
          persist-credentials: false # Avoid retaining the GitHub token for later Git commands.

      - name: Cache downloaded dependencies # Reuse downloaded packages to reduce installation time.
        uses: actions/cache@v6 # Restore a matching cache and save a new cache after a successful job if needed.
        with: # Configure which files to cache and how to identify them.
          path: .yarn-cache # Cache Yarn's downloaded packages, not the installed node_modules folder.
          key: yarn-node18-${{ runner.os }}-${{ hashFiles('yarn.lock', 'package.json') }} # Identify the cache by runtime label, runner OS, and dependency-file contents.

      - name: Install dependencies # Describe the dependency installation step.
        run: yarn install --frozen-lockfile # Install the recorded dependency versions without changing the lockfile.
      - name: Run the configured test script # Describe the step that invokes the project's test command.
        run: yarn test # Execute scripts.test from package.json

  build: # Give the second job the identifier "build".
    name: Build Docker image # Display this name in the workflow's job list.
    needs: test # Wait for the test job and proceed only if it succeeds.
    runs-on: ubuntu-latest # Allocate a separate Ubuntu machine with Docker available.

    steps: # Execute these build and publishing steps sequentially.
      - name: Check out repository # Retrieve the code again because jobs do not share a working directory.
        uses: actions/checkout@v7 # Download the repository code for the triggering event.
        with: # Supply configuration options to the checkout action.
          persist-credentials: false # Avoid retaining the GitHub token for later Git commands.

      - name: Build image # Describe the step that packages the application.
        run: docker build -t "juice-shop:$GITHUB_SHA" . # Build using the current directory's Dockerfile and tag the local image with the event's commit SHA.

      - name: Log in to Docker Hub # Authenticate before publishing the built image.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' # Skip authentication on pull requests; allow it only for pushes to main.
        uses: docker/login-action@v4 # Authenticate with Docker Hub and log out during the action's cleanup.
        with: # Provide the credentials required by the login action.
          username: ${{ vars.DOCKERHUB_USERNAME }} # Read your Docker Hub username from a GitHub Actions repository variable.
          password: ${{ secrets.DOCKERHUB_TOKEN }} # Read your Docker Hub access token from a GitHub Actions repository secret.

      - name: Publish image # Describe the step that uploads the image to your registry.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' # Publish only after a push or merge to main.
        env: # Define environment variables specifically for this publishing step.
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }} # Make the configured Docker Hub username available to the shell.
        run: | # Execute the following lines as a multiline shell script.
          IMAGE="$DOCKERHUB_USERNAME/lucien-juice-shop:$GITHUB_SHA" # Construct the destination image name with a commit-specific tag.
          docker tag "juice-shop:$GITHUB_SHA" "$IMAGE" # Give the existing local image its Docker Hub destination tag.
          docker push "$IMAGE" # Upload the tagged image to your lucien-juice-shop repository on Docker Hub.